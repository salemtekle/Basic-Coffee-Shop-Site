  <!-- Bootstrap JS (for navbar toggle) -->

<script>
  document.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault(); // Stop the page from reloading

    const query = document.getElementById("searchInput").value.toLowerCase();
    const links = document.querySelectorAll(".search-item a");

    let found = false;

    links.forEach(link => {
      const text = link.textContent.toLowerCase();
      if (text.includes(query)) {
        link.style.backgroundColor = "yellow"; // Optional: highlight result
        link.scrollIntoView({ behavior: "smooth", block: "center" }); // Scroll to it
        found = true;
      } else {
        link.style.backgroundColor = ""; // Reset background
      }
    });

    if (!found) {
      alert("No matching shoes found.");
    }
  });
</script>
